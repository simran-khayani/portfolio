<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f2a44" />
  <title>Simran Khayani — Business analytics, risk & product</title>
  <meta name="description" content="Simran Khayani works at the intersection of business analytics, risk and product, turning analysis into better decisions." />
  <meta property="og:title" content="Simran Khayani — Business analytics, risk & product" />
  <meta property="og:description" content="A closer look at Simran Khayani’s work across analytics, risk, product and strategy." />
  <meta property="og:image" content="Assets/profile.jpeg" />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%2319354a'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Georgia' font-size='25' fill='%23f6f0e8'%3ESK%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main" data-copy="skip"></a>
  <div class="scroll-progress" aria-hidden="true"><span></span></div>

  <header class="topbar">
    <a class="brand" href="#top" data-copy-aria="backToTop" aria-label="">
      <span class="brand-mark" data-person="monogram"></span>
      <span class="brand-name" data-person="name"></span>
    </a>
    <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-nav" data-copy-aria="menu">
      <span data-copy="menu"></span><i aria-hidden="true"></i>
    </button>
    <nav id="site-nav" class="site-nav" data-copy-aria="navigation" aria-label=""></nav>
    <a class="button button-small resume-button magnetic" data-person-href="resume" data-copy-aria="previewResume" data-magnetic target="_blank" rel="noopener">
      <span class="resume-label-long" data-copy="resume"></span><span class="resume-label-short" data-copy="resumeShort" aria-hidden="true"></span><span class="button-arrow" aria-hidden="true">↗</span>
    </a>
  </header>

  <main id="main">
    <section id="top" class="hero page-shell" aria-labelledby="hero-title">
      <div class="hero-copy">
        <a id="hero-school" class="hero-school" href="#education"></a>
        <p class="eyebrow" data-person="eyebrow"></p>
        <h1 id="hero-title" data-person="headline"></h1>
        <p class="hero-subline" data-person="subline"></p>
        <div class="hero-actions">
          <a class="button magnetic" data-magnetic href="#projects"><span data-copy="workCta"></span><span class="button-arrow" aria-hidden="true">↓</span></a>
          <a class="text-link magnetic" data-magnetic href="#contact"><span data-copy="contactCta"></span><span aria-hidden="true">↗</span></a>
        </div>
        <div class="hero-contact">
          <a id="hero-email" class="hero-contact-email"></a>
          <a data-person-link="linkedin" data-copy-aria="contact.linkedin" aria-label="">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.2 8.7H2V22h3.2V8.7ZM3.6 2a1.9 1.9 0 1 0 0 3.8 1.9 1.9 0 0 0 0-3.8ZM22 14.4c0-4-2.1-5.9-5-5.9a4.3 4.3 0 0 0-3.9 2.1v-1.9H10V22h3.2v-6.6c0-1.7.3-3.3 2.4-3.3s2.1 1.9 2.1 3.4V22H22v-7.6Z" /></svg>
            <span data-copy="contact.linkedin"></span>
          </a>
          <a data-person-link="github" data-copy-aria="contact.github" aria-label="">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .8a11.3 11.3 0 0 0-3.6 22c.6.1.8-.3.8-.6v-2.2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.6-1.3-1.6-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.7 2.5 1.2 3.2.9.1-.7.4-1.2.7-1.5-2.6-.3-5.4-1.3-5.4-5.6 0-1.2.4-2.2 1.2-3-.1-.3-.5-1.5.1-3 0 0 1-.3 3.1 1.2a10.7 10.7 0 0 1 5.7 0c2.2-1.5 3.1-1.2 3.1-1.2.6 1.5.2 2.7.1 3 .8.8 1.2 1.8 1.2 3 0 4.3-2.8 5.3-5.4 5.6.4.3.8 1 .8 2v3.3c0 .3.2.7.8.6A11.3 11.3 0 0 0 12 .8Z" /></svg>
            <span data-copy="contact.github"></span>
          </a>
        </div>
        <div class="scroll-cue"><span data-copy="scrollCue"></span><i aria-hidden="true"></i></div>
      </div>
      <div class="hero-visual">
        <span class="cover-number" data-copy="coverNumber" aria-hidden="true"></span>
        <div class="portrait-frame">
          <img data-person-image="image" width="1086" height="1448" fetchpriority="high" />
          <span class="portrait-stamp" data-person="monogram" aria-hidden="true"></span>
        </div>
        <div class="cover-caption"><span data-person="name"></span><span data-copy="coverCaption"></span></div>
      </div>
      <p class="hero-note" data-copy="coverNote"></p>
      <div class="hero-constellation" aria-hidden="true">
        <svg viewBox="0 0 280 160" fill="none">
          <path d="M12 124C72 123 73 53 130 62s58 53 103 11 29-42 37-55" />
          <circle cx="12" cy="124" r="4" />
          <circle cx="130" cy="62" r="4" />
          <circle cx="233" cy="73" r="4" />
          <circle cx="270" cy="18" r="4" />
        </svg>
        <span>01—06</span>
      </div>
    </section>

    <section id="experience" class="section-shell section-block" aria-labelledby="experience-title">
      <div class="section-intro reveal">
        <p class="eyebrow" data-copy="experience.eyebrow"></p>
        <h2 id="experience-title" data-copy="experience.title"></h2>
        <p data-copy="experience.intro"></p>
      </div>
      <div id="experience-list" class="experience-list"></div>
    </section>

    <section id="recognition" class="recognition section-block" aria-labelledby="recognition-title">
      <div class="section-shell">
        <div class="section-intro reveal">
          <p class="eyebrow" data-copy="recognition.eyebrow"></p>
          <h2 id="recognition-title" data-copy="recognition.title"></h2>
        </div>
        <div id="recognition-grid" class="recognition-grid"></div>
      </div>
    </section>

    <section id="projects" class="section-shell section-block" aria-labelledby="projects-title">
      <div class="section-intro reveal">
        <p class="eyebrow" data-copy="projects.eyebrow"></p>
        <h2 id="projects-title" data-copy="projects.title"></h2>
      </div>
      <div id="project-list" class="project-list"></div>
    </section>

    <section id="education" class="section-shell section-block" aria-labelledby="education-title">
      <div class="section-intro reveal">
        <p class="eyebrow" data-copy="education.eyebrow"></p>
        <h2 id="education-title" data-copy="education.title"></h2>
      </div>
      <div id="education-list" class="education-list"></div>
    </section>

    <section id="skills" class="skills-section section-block" aria-labelledby="skills-title">
      <div class="section-shell">
        <div class="section-intro reveal">
          <p class="eyebrow" data-copy="skills.eyebrow"></p>
          <h2 id="skills-title" data-copy="skills.title"></h2>
          <p data-copy="skills.hint"></p>
        </div>
        <div id="skills-list" class="skills-list"></div>
      </div>
    </section>

    <section id="outside" class="outside section-block" aria-labelledby="outside-title">
      <div class="section-shell outside-inner reveal">
        <div>
          <p class="eyebrow" data-copy="outside.eyebrow"></p>
          <h2 id="outside-title" data-copy="outside.title"></h2>
        </div>
        <div class="outside-copy">
          <p data-copy="outside.copy"></p>
          <div id="activity-list" class="activity-list"></div>
          <a class="text-link" data-person-link="instagram"><span data-copy="outside.instagramLink"></span><span aria-hidden="true">↗</span></a>
        </div>
        <p class="fact"><span data-copy="outside.factLabel"></span><strong data-person="instagramFact"></strong></p>
      </div>
    </section>

    <section id="contact" class="contact section-shell section-block" aria-labelledby="contact-title">
      <div class="contact-inner reveal">
        <p class="eyebrow" data-copy="contact.eyebrow"></p>
        <h2 id="contact-title" data-copy="contact.title"></h2>
        <p class="contact-intro" data-copy="contact.intro"></p>
        <div class="email-row">
          <a id="email-link"></a>
          <button id="copy-email" class="copy-button" type="button" data-copy="contact.copyEmail"></button>
        </div>
        <div class="socials">
          <a data-person-link="linkedin" data-copy-aria="contact.linkedin" aria-label="">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.2 8.7H2V22h3.2V8.7ZM3.6 2a1.9 1.9 0 1 0 0 3.8 1.9 1.9 0 0 0 0-3.8ZM22 14.4c0-4-2.1-5.9-5-5.9a4.3 4.3 0 0 0-3.9 2.1v-1.9H10V22h3.2v-6.6c0-1.7.3-3.3 2.4-3.3s2.1 1.9 2.1 3.4V22H22v-7.6Z" /></svg>
          </a>
          <a data-person-link="github" data-copy-aria="contact.github" aria-label="">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .8a11.3 11.3 0 0 0-3.6 22c.6.1.8-.3.8-.6v-2.2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.6-1.3-1.6-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.7 2.5 1.2 3.2.9.1-.7.4-1.2.7-1.5-2.6-.3-5.4-1.3-5.4-5.6 0-1.2.4-2.2 1.2-3-.1-.3-.5-1.5.1-3 0 0 1-.3 3.1 1.2a10.7 10.7 0 0 1 5.7 0c2.2-1.5 3.1-1.2 3.1-1.2.6 1.5.2 2.7.1 3 .8.8 1.2 1.8 1.2 3 0 4.3-2.8 5.3-5.4 5.6.4.3.8 1 .8 2v3.3c0 .3.2.7.8.6A11.3 11.3 0 0 0 12 .8Z" /></svg>
          </a>
          <a data-person-link="instagram" data-copy-aria="contact.instagram" aria-label="">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 2h9.6A5.2 5.2 0 0 1 22 7.2v9.6a5.2 5.2 0 0 1-5.2 5.2H7.2A5.2 5.2 0 0 1 2 16.8V7.2A5.2 5.2 0 0 1 7.2 2Zm0 2A3.2 3.2 0 0 0 4 7.2v9.6A3.2 3.2 0 0 0 7.2 20h9.6a3.2 3.2 0 0 0 3.2-3.2V7.2A3.2 3.2 0 0 0 16.8 4H7.2Zm4.8 3a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm5.2-3.5a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4Z" /></svg>
          </a>
        </div>
        <p class="contact-note" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>© <span id="year"></span> <span data-person="name"></span></span>
    <span data-copy="footer"></span>
    <a href="#top" data-copy-aria="backToTop" aria-label="">↑</a>
  </footer>

  <div class="custom-cursor" aria-hidden="true"><span></span><b></b></div>
  <div class="toast" role="status" aria-live="polite"></div>
  <script src="content.js"></script>
  <script src="main.js"></script>
</body>
</html>
