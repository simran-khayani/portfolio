<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="Simran Khayani is a business analyst in risk, compliance and product strategy with 3+ years at Deutsche Bank and Emeritus, and an MSBA candidate at Carnegie Mellon Tepper (May 2027)." />
  <link rel="canonical" href="https://simrankhayani.vercel.app/" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://simrankhayani.vercel.app/" />
  <meta property="og:title" content="Simran Khayani — Business analyst in risk, compliance & product strategy" />
  <meta property="og:description" content="3+ years at Deutsche Bank and Emeritus · MSBA, Carnegie Mellon Tepper, May 2027." />
  <meta property="og:image" content="https://simrankhayani.vercel.app/Assets/profile.jpeg" />
  <meta property="og:image:alt" content="Portrait of Simran Khayani" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Simran Khayani — Business analyst in risk, compliance & product strategy" />
  <meta name="twitter:description" content="3+ years at Deutsche Bank and Emeritus · MSBA, Carnegie Mellon Tepper, May 2027." />
  <meta name="twitter:image" content="https://simrankhayani.vercel.app/Assets/profile.jpeg" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" /></noscript>
  <link rel="preload" as="image" href="Assets/profile-640.webp" type="image/webp" fetchpriority="high" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main" data-copy="skip"></a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#top">
        <span class="brand-mark" data-person="monogram" aria-hidden="true"></span>
        <span class="brand-name" data-person="name">Simran Khayani</span>
      </a>
      <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-nav">
        <span data-copy="menu">Menu</span>
      </button>
      <nav id="site-nav" class="site-nav" data-copy-aria="navigation" aria-label=""></nav>
      <a class="topbar-resume" data-person-href="resume" target="_blank" rel="noopener">
        <span data-copy="resumeShort">Resume</span><span aria-hidden="true"> ↗</span>
      </a>
    </div>
  </header>

  <main id="main">
    <section id="top" class="hero shell" aria-labelledby="hero-title">
      <div class="hero-copy">
        <p class="hero-name" data-person="name">Simran Khayani</p>
        <h1 id="hero-title" data-person="headline">Business analyst in risk, compliance &amp; product strategy.</h1>
        <p class="hero-subhead" data-person="subhead">3+ years at Deutsche Bank and Emeritus · MSBA, Carnegie Mellon Tepper, May&nbsp;2027.</p>
        <p class="hero-target" data-person="target"></p>
        <div class="hero-actions">
          <a class="button button-primary" data-person-href="resume" target="_blank" rel="noopener">
            <span data-copy="resume">View resume</span><span aria-hidden="true">↗</span>
          </a>
          <a class="button button-secondary" href="#contact" data-copy="contactCta">Get in touch</a>
        </div>
        <ul class="hero-links">
          <li><a id="hero-email" href="mailto:simrankhayani11@gmail.com">simrankhayani11@gmail.com</a></li>
          <li><a data-person-link="linkedin" data-copy="contact.linkedin">LinkedIn</a></li>
          <li><a data-person-link="github" data-copy="contact.github">GitHub</a></li>
        </ul>
      </div>
      <div class="hero-photo">
        <picture>
          <source srcset="Assets/profile-640.webp" type="image/webp" />
          <img src="Assets/profile-640.jpg" alt="Portrait of Simran Khayani" width="640" height="853" fetchpriority="high" />
        </picture>
      </div>
    </section>

    <section id="experience" class="section shell" aria-labelledby="experience-title">
      <header class="section-head reveal">
        <h2 id="experience-title" data-copy="experience.title"></h2>
        <p data-copy="experience.subtitle"></p>
      </header>
      <div id="experience-list" class="experience-list"></div>
    </section>

    <section id="work" class="section shell" aria-labelledby="work-title">
      <header class="section-head reveal">
        <h2 id="work-title" data-copy="work.title"></h2>
        <p data-copy="work.subtitle"></p>
      </header>
      <div id="work-list" class="work-list"></div>
    </section>

    <section id="recognition" class="section section-band" aria-labelledby="recognition-title">
      <div class="shell recognition-inner">
        <header class="section-head reveal">
          <h2 id="recognition-title" data-copy="recognition.title"></h2>
          <p data-copy="recognition.subtitle"></p>
        </header>
        <div id="recognition-list" class="recognition-list"></div>
      </div>
    </section>

    <section id="education" class="section shell" aria-labelledby="education-title">
      <header class="section-head reveal">
        <h2 id="education-title" data-copy="education.title"></h2>
        <p data-copy="education.subtitle"></p>
      </header>
      <div id="education-list" class="education-list"></div>
      <div id="certifications" class="certifications reveal"></div>
    </section>

    <section id="skills" class="section shell" aria-labelledby="skills-title">
      <header class="section-head reveal">
        <h2 id="skills-title" data-copy="skills.title"></h2>
        <p data-copy="skills.subtitle"></p>
      </header>
      <dl id="skills-list" class="skills-list reveal"></dl>
    </section>

    <section id="contact" class="section shell" aria-labelledby="contact-title">
      <header class="section-head reveal">
        <h2 id="contact-title" data-copy="contact.title"></h2>
        <p data-copy="contact.subtitle"></p>
      </header>
      <div class="contact-row reveal">
        <a id="email-link" class="contact-email"></a>
        <button id="copy-email" class="button button-secondary button-small" type="button" data-copy="contact.copyEmail"></button>
      </div>
      <ul class="contact-links reveal">
        <li><a data-person-link="linkedin" data-copy="contact.linkedin"></a></li>
        <li><a data-person-link="github" data-copy="contact.github"></a></li>
        <li><a data-person-href="resume" target="_blank" rel="noopener" data-copy="resume"></a></li>
      </ul>
      <p class="contact-note" aria-live="polite"></p>
    </section>
  </main>

  <footer class="footer">
    <div class="shell footer-inner">
      <p data-copy="outside"></p>
      <p>© <span id="year"></span> <span data-person="name"></span></p>
    </div>
  </footer>

  <script src="content.js"></script>
  <script src="main.js"></script>
</body>
</html>
